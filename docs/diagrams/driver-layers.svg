<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">bmp581::Driver&lt;Bus&gt;, inc/bmp581_driver.hpp</text>
<text x="56" y="510.4" font-size="20" font-weight="700" fill="#3730A3">Register transport</text>
<text x="56" y="541" font-size="17" fill="#2B3442">BusInterface&lt;Bus&gt;: CRTP base, no virtual calls; register map and bit fields in</text>
<text x="56" y="565.7" font-size="17" fill="#2B3442">bmp581_registers.hpp, results and configuration in bmp581_types.hpp</text>
<text x="56" y="664.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="693.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">WriteRegs()  ReadRegs()  DelayUs()  EnsureInitialized()</text>
<text x="56" y="792.4" font-size="20" font-weight="700" fill="#17202C">BMP581</text>
<text x="56" y="823" font-size="17" fill="#2B3442">I2C up to 1 MHz at 0x46 / 0x47, or SPI mode 0 / 3 up to 12 MHz  /  INT</text>
