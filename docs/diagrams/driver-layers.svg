<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="909" viewBox="0 0 1200 909" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">Three layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: the application calls the hardware-agnostic BMP581 driver, which reads and writes registers through the CRTP register transport, which calls the platform port you write, which drives the I2C or SPI bus of the BMP581.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="908" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3730A3">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#17202C">Three layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#566070">The driver and the transport are the same on every MCU. The port is a small class with four methods.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#E2E7EE"/>
